# The application team's own manifest (not from the golden path).
apiVersion: v1
kind: ConfigMap
metadata:
  name: trade-docs-ocr-config
  namespace: trade-finance
data:
  DB_URL: postgresql://trade-docs-ocr-db.trade-finance.db.bank.local:5432/trade_docs_ocr
  UPSTREAMS: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-docs-ocr
  namespace: trade-finance
  labels:
    app.kubernetes.io/name: trade-docs-ocr
    bank.sim/owner-team: team-trade-finance
    bank.sim/tier: tier-2
    bank.sim/cost-centre: CC-SG-1300
    bank.sim/data-classification: confidential
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: trade-docs-ocr}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trade-docs-ocr
        bank.sim/owner-team: team-trade-finance
        bank.sim/tier: tier-2
        bank.sim/cost-centre: CC-SG-1300
        bank.sim/data-classification: confidential
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: bank-sim/txn-service:1.4.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: APP_NAME, value: trade-docs-ocr}
            - {name: DOMAIN, value: trade-finance}
            - {name: REQUIRED_CONFIG, value: DB_URL}
          envFrom:
            - configMapRef: {name: trade-docs-ocr-config}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 750m, memory: 768Mi}
            limits: {cpu: 1500m, memory: 1536Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: trade-docs-ocr
  namespace: trade-finance
spec:
  selector: {app.kubernetes.io/name: trade-docs-ocr}
  ports:
    - {name: http, port: 8080, targetPort: http}
