# The agent's identity: read-only, cluster-wide, and nothing else.
#   - only get/list/watch, never create/update/patch/delete
#   - no Secrets and no ConfigMaps (their contents may hold credentials)
#   - no pods/exec, pods/attach, pods/portforward, nodes/proxy, serviceaccounts/token
#   - no escalate/bind/impersonate, no aggregation: it cannot grant itself more
# Validate with ./scripts/sre-agent-verify.sh (kubectl auth can-i as the ServiceAccount).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: sre-agent
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-agent-readonly
  labels:
    app.kubernetes.io/name: sre-agent
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, nodes, namespaces, services, endpoints, persistentvolumeclaims,
                persistentvolumes, resourcequotas, limitranges, replicationcontrollers]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-agent-readonly
subjects:
  - kind: ServiceAccount
    name: sre-agent
    namespace: sre-agent
