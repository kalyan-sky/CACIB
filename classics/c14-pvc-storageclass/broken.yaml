apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: documents
spec:
  storageClassName: fast-ssd
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docstore
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: docstore}
  template:
    metadata:
      labels: {app: docstore}
    spec:
      containers:
        - name: docstore
          image: busybox:1.36
          command: ["sh", "-c", "date >> /data/started.log; cat /data/started.log; sleep 36000"]
          volumeMounts:
            - name: documents
              mountPath: /data
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
      volumes:
        - name: documents
          persistentVolumeClaim:
            claimName: documents
