apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels: {app: client}
  template:
    metadata:
      labels: {app: client}
    spec:
      containers:
        - name: client
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                if timeout 5 nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1; then echo "dns OK"; else echo "dns lookup FAILED"; fi
                sleep 5
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
