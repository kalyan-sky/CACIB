apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
spec:
  replicas: 1
  selector:
    matchLabels: {app: ledger}
  template:
    metadata:
      labels: {app: ledger}
    spec:
      containers:
        - name: ledger
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "loading ledger snapshot (takes ~25 s)..."
              sleep 25
              mkdir -p /tmp/www && echo ok > /tmp/www/index.html
              echo "listening on 8080"
              exec httpd -f -p 8080 -h /tmp/www
          ports:
            - containerPort: 8080
          livenessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 3
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
