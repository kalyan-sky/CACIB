apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
stringData:
  username: app_user
  pasword: s3cr3t-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
spec:
  replicas: 1
  selector:
    matchLabels: {app: billing}
  template:
    metadata:
      labels: {app: billing}
    spec:
      containers:
        - name: billing
          image: busybox:1.36
          command: ["sh", "-c", "echo connecting as $DB_USER; sleep 36000"]
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: db-credentials, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-credentials, key: password}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
