name: ci
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7 && echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: make test
