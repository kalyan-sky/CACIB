# Application inventory (the "CMDB") for the simulated bank.
#
# This file is the single source of truth. Run `make render` to turn it into
# Kubernetes manifests under rendered/ - never edit rendered/ by hand.
#
# Fields:
#   name         DNS-safe app id, unique per domain (namespace)
#   domain       business domain = Kubernetes namespace
#   tier         1 = critical (2+ replicas, PDB, zone spread), 2 = important, 3 = best effort
#   exposure     "edge" = reachable from the ingress/traffic tier
#   upstreams    <namespace>/<app> this app calls on every transaction
#   core         part of the "lite" profile and of the incident scenarios
#   resources    optional {cpu, memory} request override
#   config       optional extra key/values for the app's ConfigMap

domains:
  payments:
    team: team-payments
    cost_centre: CC-SG-1100
    data_classification: restricted
    description: 'Payments & cash management: MEPS+, FAST/PayNow, SWIFT, GIRO'
  core-banking:
    team: team-core-banking
    cost_centre: CC-SG-1200
    data_classification: restricted
    description: Accounts, ledgers, deposits and loans
  trade-finance:
    team: team-trade-finance
    cost_centre: CC-SG-1300
    data_classification: confidential
    description: Letters of credit, guarantees, collections, supply-chain finance
  treasury-markets:
    team: team-treasury
    cost_centre: CC-SG-1400
    data_classification: confidential
    description: FX, rates, liquidity and market-risk calculation
  risk-compliance:
    team: team-risk-compliance
    cost_centre: CC-SG-1500
    data_classification: restricted
    description: Fraud, sanctions, AML/KYC and credit risk
  channels:
    team: team-digital-channels
    cost_centre: CC-SG-1600
    data_classification: confidential
    description: Corporate portal, host-to-host and API banking
  data-reporting:
    team: team-data-reporting
    cost_centre: CC-SG-1700
    data_classification: confidential
    description: Regulatory (MAS) and management reporting
  shared-services:
    team: team-shared-services
    cost_centre: CC-SG-1800
    data_classification: internal
    description: Identity, notifications, audit logging, reference data
applications:
- name: payments-gateway
  domain: payments
  tier: 1
  exposure: edge
  description: 'Orchestrates outgoing payments: fraud check, FX conversion, ledger posting'
  upstreams: [risk-compliance/fraud-screening, treasury-markets/fx-rates, core-banking/core-ledger]
  core: true
- name: paynow-fast-adapter
  domain: payments
  tier: 1
  exposure: edge
  description: Singapore FAST / PayNow real-time payments adapter
  upstreams: [risk-compliance/fraud-screening, core-banking/core-ledger]
  core: true
- name: swift-connector
  domain: payments
  tier: 1
  description: SWIFT MT/MX (ISO 20022) message gateway
  upstreams: [risk-compliance/sanctions-screening]
  core: true
- name: core-ledger
  domain: core-banking
  tier: 1
  description: General ledger and transaction posting engine
  upstreams: [shared-services/audit-log-service]
  core: true
- name: account-service
  domain: core-banking
  tier: 1
  description: Account master data and balances API
  upstreams: [core-banking/core-ledger]
  core: true
- name: fraud-screening
